<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Video scroll test</title>
  <style>
    html, body { margin: 0; background: #1E3B2F; }
    .spacer { position: relative; height: 300vh; height: 300svh; }
    .stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #1E3B2F; }
    .spacer.is-static { height: auto; }
    .spacer.is-static .stage { position: relative; height: 100vh; height: 100svh; }
  </style>
</head>
<body>
  <div class="spacer" data-scrub>
    <div class="stage">
      <video data-hero-video muted playsinline preload="auto" poster="media/coffee-milk-poster.jpg?v=20261011h">
        <source src="media/coffee-milk.mp4?v=20261011h" type="video/mp4">
      </video>
    </div>
  </div>
  <script>
  (function () {
    var scrub = document.querySelector("[data-scrub]");
    var video = document.querySelector("[data-hero-video]");
    var reduceMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)").matches : false;
    var saveData = !!(navigator.connection && navigator.connection.saveData);
    video.muted = true;
    video.pause();
    if (reduceMotion || saveData) {
      scrub.classList.add("is-static");
      video.preload = "none";
      video.controls = true;
      return;
    }
    video.addEventListener("play", function () { video.pause(); });
    var ready = false, queued = false, pending = false, last = -1;
    function schedule() { if (queued) { return; } queued = true; requestAnimationFrame(draw); }
    function progress() {
      var span = scrub.offsetHeight - window.innerHeight;
      if (span <= 0) { return 0; }
      var p = -scrub.getBoundingClientRect().top / span;
      return p < 0 ? 0 : (p > 1 ? 1 : p);
    }
    function draw() {
      queued = false;
      if (!ready || !isFinite(video.duration) || video.duration <= 0) { return; }
      if (video.seeking) { pending = true; return; }
      var p = progress();
      if (Math.abs(p - last) < 0.0005) { return; }
      last = p;
      video.currentTime = Math.max(0, Math.min(p * video.duration, video.duration - 0.04));
    }
    function markReady() { if (ready) { return; } ready = true; last = -1; schedule(); }
    function fullyBuffered() {
      var b = video.buffered;
      if (!b || !b.length || !isFinite(video.duration) || video.duration <= 0) { return false; }
      return b.end(b.length - 1) >= video.duration - 0.05;
    }
    video.addEventListener("seeked", function () { if (pending) { pending = false; schedule(); } });
    video.addEventListener("progress", function () { if (!ready && fullyBuffered()) { markReady(); } });
    video.addEventListener("canplaythrough", function () { if (!ready && fullyBuffered()) { markReady(); } });
    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", schedule);
    var source = video.querySelector("source");
    var url = source ? source.getAttribute("src") : null;
    if (url && window.fetch && window.URL && URL.createObjectURL) {
      fetch(url).then(function (r) {
        if (!r.ok) { throw new Error("video status " + r.status); }
        return r.blob();
      }).then(function (blob) {
        source.parentNode.removeChild(source);
        video.addEventListener("loadeddata", markReady, { once: true });
        video.src = URL.createObjectURL(blob);
        video.load();
      }).catch(function () {});
    }
    schedule();
  })();
  </script>
</body>
</html>
